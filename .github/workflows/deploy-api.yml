name: Deploy Intelligence API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'server/**'
      - 'scripts/intelligence/**'
      - 'scripts/archive_intelligence_state.py'
      - 'scripts/build_team_intelligence.py'
      - 'scripts/publish_intelligence_artifacts.py'
      - 'scripts/payload_utils.py'
      - 'data/odds_history.parquet'
      - 'data/reconstructed_trajectory_history.parquet'
      # Scenario execution reads the public league payload bundled into the
      # Vercel function. Redeploy whenever refreshed artifacts advance that
      # snapshot, or the KV-backed team record and simulator will disagree.
      - 'webapp/data/**'
      - 'requirements-api.txt'
      - 'vercel.json'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intelligence-api-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  PYTHONPATH: ${{ github.workspace }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: intelligence-api-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Use runtime-only Python dependencies
        run: cp requirements-api.txt requirements.txt
      - uses: astral-sh/setup-uv@v5
      # pandas/pyarrow are build-time only. Keeping them out of requirements.txt
      # prevents the Vercel function bundle from carrying the parquet toolchain.
      - name: Install Club Watch artifact builder
        run: uv pip install --system -r requirements-api.txt pandas pyarrow
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull production environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build production function
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy production function
        run: vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}
      # Sensitive Upstash values are intentionally non-exportable from Vercel.
      # Send compiled records through a narrow authenticated live-API relay so
      # those database credentials never leave the production function.
      - name: Publish Club Watch team records
        env:
          INTELLIGENCE_PUBLISH_TOKEN: ${{ secrets.INTELLIGENCE_PUBLISH_TOKEN }}
        run: |
          test -n "$INTELLIGENCE_PUBLISH_TOKEN"
          python scripts/build_team_intelligence.py
          python scripts/publish_intelligence_artifacts.py \
            --endpoint https://api.entenser.com/v1/admin/intelligence-artifacts
