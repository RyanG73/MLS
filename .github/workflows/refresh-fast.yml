name: Fast Result and Projection Refresh

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # refresh-failure alert issue

concurrency:
  group: live-data-refresh
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  # API-Football spine — see refresh-daily.yml for the plan/lapse-guard
  # contract. Keep the plan value in sync across workflows.
  #
  # Every other refresh workflow has carried this since the spine landed; this
  # one did not, because it was last edited 2026-08-08 and the spine path
  # arrived 2026-08-09. A spine-routed league therefore raised "API_FOOTBALL_KEY
  # not set" and took the whole run with it — 12 of 15 runs on 2026-08-14, and
  # issue #8 collected one comment per failure for a week.
  API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
  API_FOOTBALL_PLAN: mega
  API_FOOTBALL_OPS_BUDGET: "2000"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select hourly or in-window leagues
        id: select
        run: |
          LEAGUES=$(python3 scripts/fast_refresh.py --select)
          echo "leagues=$LEAGUES" >> "$GITHUB_OUTPUT"
          if [ "$LEAGUES" != "[]" ]; then
            echo "has_leagues=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Fast-refresh leagues: $LEAGUES"
      - uses: actions/setup-python@v5
        if: steps.select.outputs.has_leagues == 'true'
        with:
          python-version: '3.13'
          cache: pip
      - name: Install fast-path runtime
        if: steps.select.outputs.has_leagues == 'true'
        run: pip install -r requirements.txt
      # Newest `generated` stamp wins, per file. The blanket `git archive ... |
      # tar -x` this replaces assumed `live-data` is always fresher than `main`,
      # which is true only while this job is actually running. The branch froze
      # on 2026-08-04; the overlay then rolled 19 days of committed payloads
      # backwards while `webapp/leagues.js` stayed on `main`, and
      # validate_payloads failed the run on the disagreement — before the
      # publish step, so the run that would have refreshed the branch was the
      # run that died, for any league never in the fast-refresh selection.
      #
      # Overlaying `leagues.js` from the branch too would have reconciled that
      # one symptom, but it inverts which tree is authoritative about the
      # league set, and it still ships stale numbers. Comparing the stamp each
      # payload already carries fixes the class instead of the symptom, needs
      # to know nothing about the registry, and is the same rule the browser
      # overlay applies in webapp/index.html — one sentence to remember for
      # both: a live-data payload is used only when provably newer.
      - name: Overlay prior live-data snapshot
        if: steps.select.outputs.has_leagues == 'true'
        run: |
          git fetch origin live-data --depth=1 || true
          # Not ${RUNNER_TEMP}/live-data — the publish step below already owns
          # ${RUNNER_TEMP}/live-data.index, and one name for two things invites
          # an rm -rf that takes both.
          SNAPSHOT="${RUNNER_TEMP}/live-data-snapshot"
          rm -rf "$SNAPSHOT" && mkdir -p "$SNAPSHOT"
          git archive origin/live-data webapp/data | tar -x -C "$SNAPSHOT" || true
          python scripts/overlay_live_data.py --from "$SNAPSHOT/webapp/data"
      - name: Refresh selected leagues without refitting
        if: steps.select.outputs.has_leagues == 'true'
        run: python scripts/fast_refresh.py --refresh-selected
      - name: Rebuild fast derived surfaces
        if: steps.select.outputs.has_leagues == 'true'
        run: |
          python scripts/build_home.py
          python scripts/build_calendar.py
          python scripts/build_match_leverage.py --days 7 --sims 3000
          python scripts/fast_refresh.py --manifest
          python scripts/validate_payloads.py
      - name: Publish one-snapshot data branch
        if: steps.select.outputs.has_leagues == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export GIT_INDEX_FILE="${RUNNER_TEMP}/live-data.index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree --empty
          git add -f webapp/data
          TREE=$(git write-tree)
          COMMIT=$(git commit-tree "$TREE" -m "chore(data): fast live snapshot [$(date -u +%Y-%m-%dT%H:%MZ)]")
          git push --force origin "$COMMIT":refs/heads/live-data

      # This job had no failure alert at all, unlike refresh-daily and
      # refresh-leagues, and that is how a 403 on one league kept it red for
      # seven consecutive runs on 2026-08-07 (16:03-21:56 UTC) with nobody
      # noticing. A single dead feed no longer fails the run, so a failure that
      # reaches here is worth a human's attention. Idempotent, and matches the
      # sibling workflows verbatim.
      - name: Open an issue if the refresh failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Data refresh failed: ${context.workflow}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'refresh-failure',
            });
            const body = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existing.data.some(i => i.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data.find(i => i.title === title).number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['refresh-failure'],
              });
            }
