name: Refresh European League Data

on:
  schedule:
    - cron: '0 4 * * 1'   # 04:00 UTC every Monday
  workflow_dispatch:
    inputs:
      league:
        description: 'Single league to rebuild (leave blank for all)'
        required: false
        default: ''

permissions:
  contents: write
  issues: write   # refresh-failure alert issue

# Repo root on the import path so scripts can `import data_pipeline` / `scripts.*`
# (matches the local build_all.sh; prevents ModuleNotFoundError in CI).
env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache football-data parquet files
        uses: actions/cache@v4
        with:
          path: data/football_data/
          key: football-data-${{ hashFiles('scripts/build_*.py', 'data_pipeline/**/*.py') }}
          restore-keys: football-data-

      - name: Build leagues
        run: |
          LEAGUES="${{ github.event.inputs.league }}"
          if [ -z "$LEAGUES" ]; then
            # Derived from build_league_data.OUTLOOK, not hardcoded (2026-07-24).
            # This weekly job is the ONLY thing that flips an off-season league
            # from status="completed" back to "live" — refresh-daily.yml builds
            # only leagues already live. The old hardcoded list had drifted to
            # 21 of 70 leagues, so every league added since (rounds 4, 5 and 6 —
            # saudi-pro, australia-aleague, wsl, the South American top flights,
            # and everything in round 6) could never return from its off-season.
            LEAGUES=$(python -c "from scripts.build_league_data import OUTLOOK; print(' '.join(OUTLOOK))")
          fi
          echo "Building: $LEAGUES"
          FAILED=""
          for league in $LEAGUES; do
            echo "── Building $league ──"
            python scripts/build_league_data.py --league "$league" --sims 20000 || {
              echo "WARNING: $league failed, continuing..."
              FAILED="$FAILED $league"
            }
          done
          if [ -n "$FAILED" ]; then
            echo "::warning::Failed leagues:$FAILED"
          fi

      - name: Archive odds snapshot
        run: python scripts/archive_odds_snapshot.py

      - name: Model-odds movers strip
        run: python scripts/build_movers.py

      - name: Per-race deltas (since last build)
        run: python scripts/build_race_deltas.py

      - name: Paper-bet ledger
        run: python scripts/bet_ledger.py

      - name: Edge board
        run: python scripts/build_edge_board.py

      - name: Match calendar
        run: python scripts/build_calendar.py

      - name: Drift report
        run: python scripts/build_drift_report.py

      - name: Model slice report
        run: python scripts/build_slice_report.py

      - name: Validate history growth + season bounds
        run: python scripts/validate_history_growth.py

      # Continental competitions + logo map + news all lived only in local build
      # scripts, so none of them refreshed on a CI-driven deploy. See
      # refresh-daily.yml for the full note. Every step here is non-fatal.
      - name: Continental competitions (non-fatal)
        run: |
          CUR=$(date -u +%Y); PREV=$((CUR-1))
          for C in ucl europa conference concacaf-champions leagues-cup libertadores sudamericana; do
            python -m data_pipeline.espn_continental --comp "$C" \
              --from-year "$PREV" --to-year "$CUR" || echo "$C cache refresh failed (non-fatal)"
            python scripts/build_continental_data.py --comp "$C" --sims 20000 \
              || echo "$C build failed (non-fatal)"
          done

      - name: Logo map + curated news feeds (non-fatal)
        run: |
          python scripts/build_logo_map.py || echo "build_logo_map failed (non-fatal)"
          # Matches to Watch: fixture leverage. Runs AFTER the league builds
          # because it reads their published per-fixture probabilities.
          python scripts/build_match_leverage.py --days 7 --sims 3000 \
            || echo "match leverage failed (non-fatal)"
          python scripts/build_news.py || echo "build_news failed (non-fatal)"

      - name: Build, validate, publish, and shadow Intelligence
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          python scripts/archive_intelligence_state.py
          python scripts/build_intelligence_events.py
          python scripts/build_intel_events_payload.py
          python scripts/build_team_intelligence.py
          python scripts/build_team_catalog.py
          python scripts/validate_intelligence_launch.py

      # Same separation as refresh-daily.yml: delivery must never be able to
      # discard a good build. Drop --allow-missing-config once UPSTASH_* exists.
      - name: Publish + notify (non-blocking)
        continue-on-error: true
        run: |
          python scripts/publish_intelligence_artifacts.py --allow-missing-config
          python scripts/send_intelligence_notifications.py
          python scripts/send_personalized_briefings.py
          python scripts/report_intelligence_shadow.py

      - name: Upload Intelligence shadow report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-shadow-weekly
          path: output/intelligence-shadow-report.json
          if-no-files-found: warn

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webapp/data/ data/odds_history.parquet data/match_prob_history.parquet data/weekly-archive/ data/race_deltas_history.parquet data/intelligence_events.parquet data/intelligence_events_latest.json
          git add data/bet_ledger.parquet 2>/dev/null || true
          git diff --staged --quiet && echo "No changes." || (
            git commit -m "chore(data): weekly European league refresh [$(date -u +%Y-%m-%d)]"
            git push
          )

      # A failed refresh was previously discovered by accident. Under a paid
      # tier, stale data is a refund request, so failure must reach a human.
      # GitHub emails the repo owner on a failed scheduled run only for the
      # first failure in a streak; this issue is unmissable and idempotent.
      - name: Open an issue if the refresh failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Data refresh failed: ${context.workflow}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'refresh-failure',
            });
            const body = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existing.data.some(i => i.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data.find(i => i.title === title).number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['refresh-failure'],
              });
            }
