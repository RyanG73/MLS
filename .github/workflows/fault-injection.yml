name: Fault Injection Drill

# §3.6: the source router's whole value is that a dark ESPN degrades instead of
# failing — and nothing exercises the fallback while ESPN is answering, so it
# rots quietly and the first anyone learns of it is the next outage. This runs
# the degradation contract on a schedule against a blackholed ESPN.
#
# Deliberately a separate workflow, not a step inside a refresh: this job must
# never write a payload or a commit. It proves behaviour; the refresh jobs own
# data.
on:
  schedule:
    - cron: '0 6 * * 3'   # 06:00 UTC every Wednesday, away from the refreshes
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # drill-failure alert issue

env:
  PYTHONPATH: ${{ github.workspace }}
  # Blackhole every ESPN request at data_pipeline.http.espn_get, the chokepoint
  # every adapter goes through.
  ENTENSER_BLOCK_ESPN: "1"
  API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
  # Keep in sync with refresh-daily.yml and refresh-leagues.yml — a plan change
  # that misses a workflow makes the lapse guard fail builds loudly (§8.7).
  API_FOOTBALL_PLAN: mega
  # Its own small allowance: a drill must never be able to eat the refresh's.
  API_FOOTBALL_OPS_BUDGET: "200"

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      # pytest is NOT in requirements.txt, and this job runs a pytest step
      # below. Without it that step died on "No module named pytest" — the
      # 2026-08-12 run reported the payload-regression guard as FAILED when it
      # had never executed, which is worse than not running it at all.
      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      # --live makes the real spine requests. Without a key the drill reports
      # its checks as `skipped`, not `pass` — a drill that could not reach the
      # spine has not proven the fallback.
      - name: Drill the degradation contract
        run: python scripts/fault_injection_drill.py --live

      # The guards that must still hold with a source dark. The payload-
      # regression guard is the one §10.1 calls authoritative — it stopped 51
      # leagues silently rolling back a season — so it is fatal here.
      - name: Payload-regression guard still holds
        if: always()
        run: |
          python -m pytest -q tests/test_payload_utils.py tests/test_mls_schedule_routing.py \
            tests/test_source_registry.py tests/test_source_health_surface.py

      # §10.7's guard, fatal. An earlier revision of this file made it non-fatal
      # on the claim that check_docs was already red on main with 14 figure
      # problems. That claim did not survive checking: check_docs PASSES at
      # 7caa9278 (this branch's own base), on this branch, and on current main,
      # verified in three clean worktrees. The values it named are real, but the
      # stale-value grep skips lines containing "stale", "previous" or "was "
      # (check_docs.py:219), which excludes every one of them. A guard must not
      # be downgraded on a verification that was never run.
      - name: Docs check
        if: always()
        run: python scripts/check_docs.py

      - name: Upload the drill report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fault-injection
          path: output/fault-injection.json
          if-no-files-found: warn

      - name: Open an issue if the drill failed
        if: failure()
        uses: actions/github-script@v7
        env:
          GH_ISSUES: ${{ github.token }}
        with:
          script: |
            const title = 'Fault-injection drill failed: the ESPN fallback path';
            const body = [
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`,
              '',
              'The router no longer degrades as designed with ESPN blackholed.',
              'This is the drill that exists so the fallback does not rot',
              'unnoticed between outages — treat it as a live reliability defect,',
              'not a flaky test.',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'fault-injection',
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['fault-injection'],
              });
            }
