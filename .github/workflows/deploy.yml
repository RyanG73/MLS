name: Deploy webapp to GitHub Pages

on:
  push:
    branches: [main]
  # Data-refresh workflows commit with the default GITHUB_TOKEN, and GitHub does
  # NOT fire workflows for GITHUB_TOKEN pushes — so those daily/weekly data commits
  # never deployed. Re-run this deploy when a refresh workflow finishes so the
  # freshly-committed payloads actually reach the live site.
  workflow_run:
    workflows: ["Daily In-Season Refresh", "Refresh European League Data", "Weekly Transfermarkt Snapshot"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Crawlable per-league pages + hub + sitemap (launch plan C2/C7).
      # Generated at deploy time — never committed — so every data-refresh
      # deploy regenerates them for free. stdlib-only: no pip install needed.
      # A failure here MUST fail the deploy: shipping the site without its
      # canonical league pages would orphan every indexed /leagues/ URL.
      - name: Build static league pages + sitemap
        run: python3 scripts/build_static_pages.py
      # Stamp the service-worker cache with the deploy SHA. webapp/sw.js caches
      # /index.html -- the file carrying the pricing UI and checkout button --
      # behind a hand-maintained version string. Forgetting to bump it ships a
      # deploy that returning visitors and installed-PWA users never see (it has
      # happened before; see sw.js's v2 comment). Deriving it from the commit
      # makes staleness structurally impossible rather than a thing to remember.
      - name: Stamp service-worker cache version
        run: |
          set -euo pipefail
          test -f webapp/sw.js
          grep -q 'const CACHE = "entenser-shell-' webapp/sw.js
          sed -i "s/const CACHE = \"entenser-shell-[^\"]*\"/const CACHE = \"entenser-shell-${GITHUB_SHA::12}\"/" webapp/sw.js
          grep -n 'const CACHE' webapp/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/
      - uses: actions/deploy-pages@v4
        id: deployment
