name: Daily In-Season Refresh

# B11a: every league whose payload status is "live" rebuilds daily (7 AM ET).
# Preseason/completed leagues are skipped — the weekly Monday full rebuild
# (refresh-leagues.yml) is the catch-all that flips them back to live.
on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC = 7:00 AM ET daily
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # refresh-failure alert issue

# Repo root on the import path so scripts can `import data_pipeline` / `scripts.*`
# (the local build_all.sh exports the same; its absence is why the old daily MLS
# job failed for 8+ days with ModuleNotFoundError: No module named 'data_pipeline').
env:
  PYTHONPATH: ${{ github.workspace }}
  # API-Football spine (Stage 3, 2026-08-08). The plan expectation feeds the
  # governor's silent-lapse guard: if the subscription lapses to Free, the
  # rate-limit headers stop matching and the build fails LOUD instead of
  # quietly regressing to 2024-capped data. Update the plan value when the
  # subscription changes (mega month 1 → pro after).
  API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
  API_FOOTBALL_PLAN: mega
  API_FOOTBALL_OPS_BUDGET: "2000"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      leagues: ${{ steps.set.outputs.leagues }}
    steps:
      - uses: actions/checkout@v4
      - name: List live leagues from payload status
        id: set
        run: |
          LEAGUES=$(python3 - <<'EOF'
          import json, re
          from pathlib import Path
          live = []
          # Cross-league data files carry their own status but are NOT leagues —
          # excluding them stops bogus matrix jobs like "build (edge-board)".
          for p in sorted(Path("webapp/data").glob("*.js")):
              if p.name in ("logos.js", "ledger.js", "power.js", "edge-board.js",
                            "movers.js", "drift.js", "model-slices.js", "coefficients.js",
                            "match-leverage.js"):
                  continue
              m = re.match(r"window\.\w+\s*=\s*(.*?);?\s*$", p.read_text(), re.DOTALL)
              if not m:
                  continue
              try:
                  d = json.loads(m.group(1))
              except Exception:
                  continue
              # Durable guard: any data file that isn't a payload dict (e.g.
              # search-index.js is a JSON array) is not a league — skip rather
              # than crash on .get(). Belt-and-braces with the name list above.
              if not isinstance(d, dict):
                  continue
              if d.get("status") == "live":
                  live.append(p.stem)
          print(json.dumps(live))
          EOF
          )
          echo "leagues=$LEAGUES" >> "$GITHUB_OUTPUT"
          echo "Live leagues: $LEAGUES"

  build:
    needs: detect
    if: ${{ needs.detect.outputs.leagues != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        league: ${{ fromJson(needs.detect.outputs.leagues) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Cache data directory
        uses: actions/cache@v4
        with:
          path: data/
          key: daily-data-${{ matrix.league }}-${{ hashFiles('scripts/build_*.py', 'data_pipeline/**/*.py') }}
          restore-keys: daily-data-${{ matrix.league }}-

      - name: Log Pinnacle openers + closers (MLS only; no-op without ODDS_API_KEY)
        if: matrix.league == 'mls'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python -m data_pipeline.odds_log || echo "openers failed (non-fatal)"
          python -m data_pipeline.odds_log --closers || echo "closers failed (non-fatal)"

      - name: Build league
        run: |
          if [ "${{ matrix.league }}" = "mls" ]; then
            python scripts/eval_baseline.py --cache --seed 42 \
              --test-seasons 2021 2022 2023 2024 2025 \
              --dump-frame data/parity_frame.parquet
            python scripts/build_dashboard_data.py --sims 20000
          else
            python scripts/build_league_data.py --league "${{ matrix.league }}" --sims 20000
          fi

      - name: Upload payload artifact
        uses: actions/upload-artifact@v4
        with:
          name: payload-${{ matrix.league }}
          path: |
            webapp/data/${{ matrix.league }}.js
            data/odds_log.parquet
            data/odds_closers.parquet
          if-no-files-found: warn

  finalize:
    needs: [detect, build]
    if: ${{ always() && needs.detect.outputs.leagues != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download built payloads
        uses: actions/download-artifact@v4
        with:
          pattern: payload-*
          merge-multiple: true
      - name: Build, validate, publish, and shadow Intelligence
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          python scripts/build_power_rankings.py
          # Publishes the country-coefficient reference page. No workflow ran
          # this before 2026-08-02, so it sat a month stale: the UEFA refit on
          # 2026-08-01 added ten coefficients and the published page still
          # showed 11 associations instead of 20. It is cheap and coefficients
          # change rarely, so daily costs nothing and removes the manual step.
          python scripts/build_coefficients_page.py
          python scripts/build_calendar.py
          python scripts/archive_odds_snapshot.py
          python scripts/build_movers.py
          python scripts/build_race_deltas.py
          python scripts/build_drift_report.py
          python scripts/build_slice_report.py
          python scripts/bet_ledger.py
          python scripts/build_edge_board.py
          python scripts/build_weekly_recap.py
          # Continental competitions. Same omission as build_news below: these
          # rebuilt ONLY in the local scripts/build_all.sh, so on a CI-driven
          # site they never refreshed at all — Leagues Cup sat on its 2025 final
          # bracket for 327 days while the 2026 draw was public. Each comp does
          # a merge-refresh of the current season's ESPN cache, then rebuilds
          # (the builder auto-detects concluded vs in-progress vs not-started).
          # Non-fatal per comp: one competition's feed must not cost the run.
          CUR=$(date -u +%Y); PREV=$((CUR-1))
          for C in ucl europa conference concacaf-champions leagues-cup libertadores sudamericana; do
            python -m data_pipeline.espn_continental --comp "$C" \
              --from-year "$PREV" --to-year "$CUR" || echo "$C cache refresh failed (non-fatal)"
            python scripts/build_continental_data.py --comp "$C" --sims 20000 \
              || echo "$C build failed (non-fatal)"
          done
          python scripts/build_logo_map.py || echo "logo map failed (non-fatal)"
          # Matches to Watch: fixture leverage. Runs AFTER the league builds
          # because it reads their published per-fixture probabilities.
          python scripts/build_match_leverage.py --days 7 --sims 3000 \
            || echo "match leverage failed (non-fatal)"
          # Curated RSS feeds. Ran ONLY in the local scripts/daily_build.sh until
          # 2026-07-25, so webapp/data/news/ went stale the moment the live site
          # moved to CI refresh+deploy — payloads rebuilt nightly while the news
          # rail sat 12 days old. Non-fatal on purpose: an outlet changing its
          # RSS path must never cost the run its payload commit (see bug #2 note
          # below), and per-feed failures are already warnings inside the script.
          python scripts/build_news.py || echo "build_news failed (non-fatal)"
          python scripts/validate_payloads.py
          python scripts/validate_history_growth.py
          python scripts/archive_intelligence_state.py
          python scripts/build_intelligence_events.py
          python scripts/build_intel_events_payload.py
          python scripts/build_team_intelligence.py
          python scripts/build_team_catalog.py
          python scripts/validate_intelligence_launch.py
      # Delivery side-effects, deliberately separated from the build above and
      # from the commit below. Bug #2 (2026-07-19..23) discarded five nights of
      # correctly-built data because ONE of these exited non-zero and the commit
      # step was fail-fast. --allow-missing-config was only half the fix: any
      # other failure here would have done the same thing. Built data is now
      # committed regardless of whether delivery succeeded, and delivery
      # failures still surface as an annotation on the run.
      # Drop --allow-missing-config once the UPSTASH_* secrets exist so a
      # genuine publish failure is loud again.
      - name: Publish + notify (non-blocking)
        id: delivery
        continue-on-error: true
        run: |
          python scripts/publish_intelligence_artifacts.py --allow-missing-config
          python scripts/send_intelligence_notifications.py
          python scripts/send_personalized_briefings.py
          python scripts/report_intelligence_shadow.py
      - name: Upload Intelligence shadow report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-shadow-daily
          path: output/intelligence-shadow-report.json
          if-no-files-found: warn
      # §3.4: source_health.parquet is gitignored and discarded at the end of
      # every run, so the division-mismatch guard, every router fallback and the
      # plan-lapse assertion all log into nothing. This folds the run into a
      # committed summary (the only way the consecutive-dark counter can
      # survive a fresh runner) and annotates the run UI. It never fails: a run
      # that built good payloads must still commit them.
      - name: Publish the source-health surface
        if: always()
        run: python scripts/build_source_health.py --write
      - name: Upload the source-health surface
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-health-daily
          path: data/source_health_summary.json
          if-no-files-found: warn

      # No `if: always()` here on purpose. `continue-on-error` on the delivery
      # step already lets a delivery failure through to this commit, which is
      # what bug #2 needed. A *build* failure must still skip the commit --
      # shipping a half-built payload to a paying customer is worse than
      # shipping yesterday's.
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webapp/data/ data/odds_history.parquet data/match_prob_history.parquet data/weekly-archive/ data/race_deltas_history.parquet data/intelligence_events.parquet data/intelligence_events_latest.json data/source_health_summary.json
          git add data/odds_log.parquet data/odds_closers.parquet data/bet_ledger.parquet 2>/dev/null || true
          git diff --staged --quiet && echo "No changes." || (
            git commit -m "chore(data): daily in-season refresh [$(date -u +%Y-%m-%d)]"
            # Rebase-and-retry, same shape as refresh-leagues.yml. --autostash
            # is required: this step stages explicit paths, so the build's other
            # tracked changes are unstaged here and a plain `git pull --rebase`
            # refuses with "cannot pull with rebase: You have unstaged changes".
            for attempt in 1 2 3; do
              if git push; then
                echo "pushed on attempt $attempt"; break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::error::push still rejected after 3 rebase attempts"; exit 1
              fi
              echo "push rejected — rebasing onto origin/main and retrying"
              git pull --rebase --autostash origin main || {
                echo "::error::rebase failed; refusing to force a data commit"
                git rebase --abort 2>/dev/null || true
                exit 1
              }
            done
          )

      # Runs AFTER the commit on purpose. A dark feed must fail the run so a
      # human looks, but it must not discard payloads the run built correctly —
      # that is the 2026-07-19 mistake (five nights of good data thrown away
      # because a delivery step exited non-zero before the commit).
      - name: Fail on a persistently dark feed
        if: always()
        run: python scripts/build_source_health.py --check

      # A failed refresh was previously discovered by accident. Under a paid
      # tier, stale data is a refund request, so failure must reach a human.
      # GitHub emails the repo owner on a failed scheduled run only for the
      # first failure in a streak; this issue is unmissable and idempotent.
      - name: Open an issue if the refresh failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Data refresh failed: ${context.workflow}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'refresh-failure',
            });
            const body = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existing.data.some(i => i.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data.find(i => i.title === title).number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['refresh-failure'],
              });
            }
